<html>
    <head>
        <title>OOP Classes</title>
        <script>
            class Student {

            constructor(id, name, age, email, department) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
            displayInfo() {
                console.log(this.id);
                console.log(this.name);
                console.log(this.age);
                console.log(this.email);
                console.log(this.department);
            }
            updateStudent(name, age, email, department) {
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
            deleteStudent () {
                console.log("Student deleted");
            }
        } 
        class StudentManager {
            constructor() {
                this.students = [];
            }
            addStudent(student) {
                this.students.push(student);
            }
            displayAllStudents() {
                for(let i = 0; i < this.students.length; i++) {
                    this.students[i].displayInfo(); 
                };
            }
            searchStudentById(id) {
                for(let i = 0; i < this.students.length; i++) {
                    if(this.students[i].id == id) {
                        this.students[i].displayInfo();
                        return;
                    }
                }
                console.log("Student not found");
            }
            deleteStudentById(id) {
                for(let i = 0; i < this.students.length; i++) {
                    if(this.students[i].id == id) {
                        this.students.splice(i, 1);
                        console.log("Student deleted");
                        return;
                    }
                }
                console.log("Student not found");
            }
            updateStudentById(id, name, age, email, department) {
                for(let i = 0; i < this.students.length; i++) {
                    if(this.students[i].id == id) {
                        this.students[i].updateStudent(name, age, email, department);
                        console.log("Student updated");
                        return;
                    }
                }
                console.log("Student not found");
            }
        }
        
        const manager = new StudentManager();
        const student1 = new Student(1, "zohaib", 18, "zimal@gmail.com", "Information Technology");
        
        const student2 = new Student(2, "ahmad", 20, "abeer@gmail.com", "Computer Science");
        
        // Add Students
        manager.addStudent(student1);
        manager.addStudent(student2);

        //Display All Students
        manager.displayAllStudents();

        //Search Student
        manager.searchStudentById(1);

        //Update Student
        manager.updateStudentById(2, "Anaya", 22, "anaya@gmail.com", "Business Administration");
        
        // Display All Students
        manager.displayAllStudents();

        // Delete Student
        manager.deleteStudentById(1);

        // Display Remaining Students
        manager.displayAllStudents();

        </script>
    </head>
    <body>
        <h1>Create OOP classes</h1>

    </body>
</html>
