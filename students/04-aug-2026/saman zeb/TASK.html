<html>
<head>
  <title>Student Management System</title>
                     <!-- CSS CONCEPT -->
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fb; }
    h1 { color: #1a3f66; }
    form { background: #ffffff; padding: 16px; border: 1px solid #d1d9e6; max-width: 600px; }
    label { display: block; margin: 10px 0 4px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #bfc9d8; border-radius: 4px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; }
    button.submit { background: #2563eb; color: white; }
    button.reset { background: #6b7280; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px 10px; border: 1px solid #cbd5e1; }
    .edit-btn { background: #f59e0b; color: white; }
    .delete-btn { background: #dc2626; color: white; }
  </style>
</head>
<body>
  <h1>Student Management System</h1>
  <div  id="studentCount">Total Students: 0</div>

  <div style="margin:10px 0">
    <input type="text" id="searchInput" placeholder="Search by name" style="padding:8px; width:48%; box-sizing:border-box;" />
    <select id="filterDept" style="padding:8px; width:32%; box-sizing:border-box; margin-left:8px;">
      <option value="">All Departments</option>
      <option value="Computer Science">Computer Science</option>
      <option value="Information Technology">Information Technology</option>
      <option value="Software Engineering">Software Engineering</option>
      <option value="Civil">Civil</option>
      <option value="Business">Business</option>
    </select>
    <button id="clearSearch" style="padding:8px; margin-left:8px;">Clear</button>
  </div>

  <form id="studentForm">
    <label for="studentName">Student Name</label>
    <input type="text" id="studentname" placeholder="Enter student name">

    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter age" min="0" >

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter email" >

    <label>Gender</label>
    <label ><input type="radio" name="gender" value="Male"> Male</label>
    <label ><input type="radio" name="gender" value="Female"> Female</label>
    <label ><input type="radio" name="gender" value="Other"> Other</label>

    <label for="department">Department</label>
    <select id="department" >
      <option value="">Select Department</option>
      <option value="Computer Science">Computer Science</option>
      <option value="Information Technology">Information Technology</option>
      <option value="Software Engineering">Software Engineering</option>
      <option value="Civil">Civil</option>
    </select>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" >

    
    <label>Skills</label>
    <label ><input type="checkbox" name="skills" value="HTML"> HTML</label>
    <label ><input type="checkbox" name="skills" value="CSS"> CSS</label>
    <label ><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>

    <label for="address">Address</label>
    <textarea id="address" rows="2" placeholder="Enter address" ></textarea>

    <div class="actions">
      <button type="submit" class="submit">Submit</button>
      <button type="reset" class="reset">Reset</button>
    </div>
    <input type="hidden" id="studentId">
  </form>

  
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Email</th>
          <th>Gender</th>
          <th>Department</th>
          <th>Skills</th>
          <th>DOB</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
</body>
  <script src="task.js"></script>
</html>
