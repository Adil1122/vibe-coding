<html>
    <head>
         <title>Student Management System</title>
         <script src="scripts/common.js"></script>
    </head>
    <body>
         <h1>This is a task</h1>

        <form>
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name">
            <br><br>

            <label for="age">Age</label>
            <input type="number" id="age" name="age">
            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="gender" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <br><br>

            <label for="department">Department:</label>
            <input type="dropdown" id="department" name="department">
            <br><br>

            <label for="skills">Skills:</label>
            <input type="checkbox" id="skills" name="skills">
            <label for="archetict">Archetict</label>
            <input type="checkbox" id="archetict" name="archetict">
            <label for="artist">Artist</label>
            <input type="checkbox" id="artist" name="artist">
            <label for="Engineering">Engineering</label>
            <input type="checkbox" id="Engineering" name="Engineering">
            <br><br>

            <label for="date of birth">Date Of Birth:</label>
            <input type="date" id="date of birth" name="date of birth">
            <br><br>

            <label for="address">Address</label>
            <input type="textarea" id="address" name="address">
            <br><br>

            <input type="button" value="submit" onclick="addstudent()">
            
            <input type="button" value="reset">
            
        </form>
        
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>gender</th>
                <th>Department</th>
                <th>Skills</th>
                <th>Date of Birth</th>
                <th>Address</th>
                <th>delete</th>
                <th>edit</th>   
            </tr>
            <tbody id="student_table">
            </tbody>
        </table>
    </body>
</html>
