<html>
    <head>
        <title>OOP task</title>
        <script>
        class Student {
            constructor(id, name, age, email, department) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
            displayInfo() {
                console.log(this.id);
                console.log(this.name);
                console.log(this.age);
                console.log(this.email);
                console.log(this.department);
            }
            deleteStudent() {
                this.id = null;
                this.name = null;
                this.age = null;
                this.email = null;
                this.department = null;
            }
            updateStudent( id, name, age, email, department) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
        }
        class StudentManager {
            constructor() {
                this.students = [];
            }
            addStudent(student) {
                this.students.push(student);
            }
            displayAllStudents(){
                for (let i=0; i<this.students.length; i++){
                    this.students[i].displayInfo();
                }
            }
            searchStudentByid(id) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].id === id){
                        this.students[i].displayInfo();
                        return;
                    }
                }
                console.log("Student not found");
            }
            updateStudentById(id, newName, newAge, newEmail, newDepartment) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].id === id){
                        this.students[i].updateStudent(id, newName, newAge, newEmail, newDepartment);
                        console.log("Student updated");
                        return;
                    }
                }
            }
            deleteStudentById(id) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].id === id){
                        this.students[i].deleteStudent();
                        console.log("Student deleted");
                        return;
                    }
                }
                console.log("Student not found");
            }
        }

            const student1 = new Student(1, "sameer", 28, "sameer@example.com", "Dental");
            const student2 = new Student(2, "john", 29, "john@example.com", "robotics");
            const student3 = new Student(3, "david", 56, "david@example.com", "medical science");
            const newStudent = new Student(4, "farah", 47, "farah@example.com", "Aeronautical Engineering");
            
            const studentManager = new StudentManager();
            studentManager.addStudent(student1); 
            studentManager.addStudent(student2); 
            studentManager.addStudent(student3); 
            studentManager.addStudent(newStudent); 

            studentManager.displayAllStudents();
            studentManager.searchStudentByid(1);
            studentManager.updateStudentById(1, "sameer", 24, "sami@example.com", "Economics");
            studentManager.addStudent(newStudent); 
            studentManager.deleteStudentById(1);
        </script>
    </head>
    <body>
        <h1>OOP task</h1>    
    </body>
</html>
