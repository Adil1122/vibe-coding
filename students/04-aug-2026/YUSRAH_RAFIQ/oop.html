<html>
    <head>
        <title>Task Of OOP</title>
        <script>
        class Student {
            constructor(id, name, age, email, department) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
            displayInfo() {
                console.log(this.id);
                console.log(this.name);
                console.log(this.age);
                console.log(this.email);
                console.log(this.department);
            }
            deleteStudent() {
                this.id = null;
                this.name = null;
                this.age = null;
                this.email = null;
                this.department = null;
            }
            updateStudent(name, age, email, department) {
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }
        }
        class StudentManager {
            constructor() {
                this.students = [];
            }
            addStudent(student) {
                this.students.push(student);
            }
            displayAllStudents(){
                for (let i=0; i<this.students.length; i++){
                    this.students[i].displayInfo();
                }
            }
            searchStudentByName(name) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].name === name){
                        this.students[i].displayInfo();
                        return;
                    }
                }
                console.log("Student not found");
            }
            updateStudentByName(name, newName, newAge, newEmail, newDepartment) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].name === name){
                        this.students[i].updateStudent(newName, newAge, newEmail, newDepartment);
                        console.log("Student updated");
                        return;
                    }
                }
            }
            deleteStudentByName(name) {
                for (let i=0; i<this.students.length; i++){
                    if (this.students[i].name === name){
                        this.students[i].deleteStudent();
                        console.log("Student deleted");
                        return;
                    }
                }
                console.log("Student not found");
            }
        }

            const student1 = new Student(1, "Aliyan", 20, "aliyan@example.com", "Computer Science");
            const student2 = new Student(2, "sheeza", 22, "sheeza@example.com", "Mathematics");
            const student3 = new Student(3, "ayesha", 19, "ayesha@example.com", "Physics");
            const newStudent = new Student(4, "Ahmed", 23, "ahmed@example.com", "Chemistry");
            
            const studentManager = new StudentManager();
            studentManager.addStudent(student1); 
            studentManager.addStudent(student2); 
            studentManager.addStudent(student3); 
            studentManager.addStudent(newStudent); 

            studentManager.displayAllStudents();
            studentManager.searchStudentByName("Aliyan");
            studentManager.updateStudentByName("Aliyan", "Ali", 21, "ali@example.com", "Computer Science");
            studentManager.addStudent(newStudent); 
            studentManager.deleteStudentByName("Aliyan");
        </script>
    </head>
    <body>
        <h1>Task Of OOP</h1>    
    </body>
</html>
