<html>
    <head>
        <title>
            Student Management System

        </title>

        <script src="srcipts/task2.js"></script>
    </head>
    <body>
        <h1>Student Management System</h1>
    </body>
     <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter student name" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age" required><br><br>

       
         <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label for="skills">skills:</label><br>
        <select id="skills" name="skills" required>
            <option value="">--Select skills--</option>
            <option value="graphic designing">graphic designing</option>
            <option value="video editing">video editing</option>
            <option value="programing">programing</option>
            <option value="videography">videography</option>
        </select>
        <br><br>

          <label>feild:</label><br>
        <input type="checkbox" id="logodesigning" name="feild" value="logodesigning">
        <label for="logo designing">logodesigning</label>

        <input type="checkbox" id="jumpcuts" name="feild" value="jumpcuts">
        <label for="jumpcuts">jumpcuts</label>

        <input type="checkbox" id="html" name="feild" value="html">
        <label for="html">html</label>

        <input type="checkbox" id="Music & Fashion" name="feild" value="Music & Fashion">
        <label for="Music & Fashion">Music & Fashion</label>
        <br><br>

         <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required>
        <br><br>

          <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
        <br><br>

        <input type="button" value="Submit" onclick="validateForm()">
        <input type="reset" value="Reset">

    </form>
