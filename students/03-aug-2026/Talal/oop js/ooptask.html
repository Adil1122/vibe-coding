<html>
<head>
    <title>Student Management</title>
</head>

<body>

    <h1>Student Management System</h1>

    <script>


        class Student {

            constructor(id, name, age, email, department) {
                this.id = id;
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }

            displayInfo() {
                console.log("ID:", this.id);
                console.log("Name:", this.name);
                console.log("Age:", this.age);
                console.log("Email:", this.email);
                console.log("Department:", this.department);
            }

            updateStudent(name, age, email, department) {
                this.name = name;
                this.age = age;
                this.email = email;
                this.department = department;
            }

            }
        class StudentManager {

            constructor() {
                this.students = [];
            }
            addStudent(student) {
                this.students.push(student);
                console.log("Student added successfully.");
            }

            deleteStudent(id) {
                this.students = this.students.filter(
                    student => student.id !== id
                );

                console.log("Student deleted successfully.");
            }

            updateStudent(id, name, age, email, department) {

                let student = this.students.find(
                    student => student.id === id
                );

                if (student) {
                    student.name = name;
                    student.age = age;
                    student.email = email;
                    student.department = department;

                    console.log("Student updated successfully.");
                } else {
                    console.log("Student not found.");
                }
            }

            searchStudent(name) {

                let student = this.students.find(
                    student =>
                        student.name.toLowerCase() === name.toLowerCase()
                );

                if (student) {
                    console.log("Student found:");
                    student.displayInfo();
                } else {
                    console.log("Student not found.");
                }
            }

            displayAllStudents() {

                this.students.forEach(student => {
                    student.displayInfo();
                    console.log("--------------------");
                });
            }
        }

        let manager = new StudentManager();


        let student1 = new Student(
            190506,
            "Talal",
            20,
            "talalfayyaz328@gmail.com",
            "Accounting & finance"
        );


        let student2 = new Student(
            102,
            "Ahmed",
            21,
            "ahmed321@gmail.com",
            "Software Engineering"
        );
        manager.addStudent(student1);
        manager.addStudent(student2);


        manager.displayAllStudents();

        manager.searchStudent("Ali")

        manager.updateStudent(
            101,
            "Ali Khan",
            21,
            "alikhan@gmail.com",
            "Software Engineering"
        );
        console.log("After Update:");
        manager.displayAllStudents();

        manager.deleteStudent(102);

        console.log("After Delete:");
        manager.displayAllStudents();

    </script>

</body>
</html>
