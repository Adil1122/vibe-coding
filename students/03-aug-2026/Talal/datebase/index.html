<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1> Student Management System</h1>
                <div class="header-controls">
                    <div class="date-time">
                        <span id="current-date"></span>
                        <span id="current-time"></span>
                    </div>
                    <button id="dark-mode-toggle" class="dark-mode-btn" title="Toggle Dark Mode">
                         Dark Mode
                    </button>
                </div>
            </div>
        </header>

        <div class="form-section">
            <h2>Add New Student</h2>
            <form id="student-form" class="student-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" placeholder="Enter age" min="1" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Business Administration">Business Administration</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea id="address" placeholder="Enter address" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Student</button>
            </form>
        </div>

        <div class="filter-section">
            <h2>Filter Students</h2>
            <div class="filter-controls">
                <input type="text" id="search-name" placeholder="Search by name..." class="filter-input">
                <select id="filter-department" class="filter-input">
                    <option value="">All Departments</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Business Administration">Business Administration</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                </select>
                <button id="reset-filters" class="btn btn-secondary">Reset Filters</button>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Average Age</h3>
                <p id="stat-average">0</p>
            </div>
            <div class="stat-card">
                <h3>Oldest Student</h3>
                <p id="stat-max">0</p>
            </div>
            <div class="stat-card">
                <h3>Youngest Student</h3>
                <p id="stat-min">0</p>
            </div>
        </div>

        <div class="table-section">
            <h2>Students List</h2>
            <div class="table-container">
                <table id="students-table" class="students-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Address</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-tbody">
                        <tr class="empty-state">
                            <td colspan="9">No students added yet. Add a student to get started!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="edit-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Edit Student</h2>
                <form id="edit-form" class="student-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-group">
                        <label for="edit-name">Name:</label>
                        <input type="text" id="edit-name" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-age">Age:</label>
                        <input type="number" id="edit-age" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-email">Email:</label>
                        <input type="email" id="edit-email" required>
                    </div>

                    <div class="form-group">
                        <label for="edit-gender">Gender:</label>
                        <select id="edit-gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-department">Department:</label>
                        <select id="edit-department" required>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Business Administration">Business Administration</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit-address">Address:</label>
                        <textarea id="edit-address" rows="3"></textarea>
                    </div>

                    <div class="modal-buttons">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
